[project]
name = "nasa-space-apps-2026"
version = "0.1.0"
description = "NASA Earth observation and reinforcement-learning decision support for climate-resilient crop rotation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.32.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
